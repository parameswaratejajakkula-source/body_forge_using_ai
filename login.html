<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - Body Forge AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #07100c;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 900px;
            min-height: 550px;
            background: #0e1d15;
            display: flex;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(99, 214, 68, 0.15);
        }

        /* LEFT SIDE */

        .left-side {
            width: 45%;
            background: linear-gradient(
                135deg,
                #0a2b17,
                #123d22
            );

            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 50px;
        }

        .left-side h1 {
            font-size: 40px;
            margin-bottom: 20px;
        }

        .left-side h1 span {
            color: #63d644;
        }

        .left-side p {
            color: #c4d1c7;
            line-height: 1.6;
        }

        .fitness-icon {
            font-size: 80px;
            margin-top: 30px;
        }

        /* RIGHT SIDE */

        .right-side {
            width: 55%;
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .right-side h2 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #aab8ae;
            margin-bottom: 30px;
        }

        .tabs {
            display: flex;
            margin-bottom: 25px;
            border-bottom: 1px solid #2a3f32;
        }

        .tab {
            width: 50%;
            text-align: center;
            padding: 12px;
            cursor: pointer;
            color: #aab8ae;
        }

        .tab.active {
            color: #63d644;
            border-bottom: 2px solid #63d644;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #d5ddd7;
        }

        .form-group input {
            width: 100%;
            padding: 14px;
            border-radius: 7px;
            border: 1px solid #2a4935;
            background: #09140e;
            color: white;
            outline: none;
        }

        .form-group input:focus {
            border-color: #63d644;
        }

        .forgot {
            text-align: right;
            margin-bottom: 20px;
        }

        .forgot a {
            color: #63d644;
            text-decoration: none;
            font-size: 13px;
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 7px;
            background: #63d644;
            color: #07100c;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
        }

        .login-btn:hover {
            background: #7bea5b;
        }

        .or {
            text-align: center;
            color: #8b9a90;
            margin: 10px 0;
        }

        .google-btn {
            width: 100%;
            padding: 14px;
            border-radius: 7px;
            border: 1px solid #2a4935;
            background: transparent;
            color: white;
            cursor: pointer;
        }

        .back-home {
            text-align: center;
            margin-top: 25px;
        }

        .back-home a {
            color: #63d644;
            text-decoration: none;
        }

        /* SIGNUP FORM */

        #signupForm {
            display: none;
        }

        /* MOBILE */

        @media(max-width: 800px) {

            .container {
                width: 90%;
                flex-direction: column;
            }

            .left-side,
            .right-side {
                width: 100%;
            }

            .left-side {
                padding: 30px;
            }

            .left-side h1 {
                font-size: 30px;
            }

            .fitness-icon {
                display: none;
            }

            .right-side {
                padding: 30px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- LEFT SIDE -->

        <div class="left-side">

            <h1>
                BODY FORGE <span>AI</span>
            </h1>

            <p>
                Transform your body with personalized AI-powered
                workout plans, diet plans and body analysis.
            </p>

            <div class="fitness-icon">
                💪🤖
            </div>

        </div>


        <!-- RIGHT SIDE -->

        <div class="right-side">

            <h2 id="formTitle">Welcome Back!</h2>

            <p class="subtitle" id="formSubtitle">
                Login to continue your fitness journey.
            </p>


            <!-- TABS -->

            <div class="tabs">

                <div class="tab active" id="loginTab"
                    onclick="showLogin()">
                    Login
                </div>

                <div class="tab" id="signupTab"
                    onclick="showSignup()">
                    Sign Up
                </div>

            </div>


            <!-- LOGIN FORM -->

            <form id="loginForm">

                <div class="form-group">

                    <label>Email Address</label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Password</label>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <div class="forgot">
                    <a href="#">Forgot Password?</a>
                </div>


                <button
                    type="submit"
                    class="login-btn"
                >
                    Login
                </button>

            </form>


            <!-- SIGNUP FORM -->

            <form id="signupForm">

                <div class="form-group">

                    <label>Full Name</label>

                    <input
                        type="text"
                        id="signupName"
                        placeholder="Enter your name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Email Address</label>

                    <input
                        type="email"
                        id="signupEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Create Password</label>

                    <input
                        type="password"
                        id="signupPassword"
                        placeholder="Create password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-btn"
                >
                    Create Account
                </button>

            </form>


            <div class="or">OR</div>


            <button class="google-btn">
                🔵 Continue with Google
            </button>


            <div class="back-home">
                <a href="index.html">
                    ← Back to Home
                </a>
            </div>

        </div>

    </div>


    <!-- JAVASCRIPT -->

    <script type="module">
        import "./bf-db.js";

        function showLogin() {
            document.getElementById("loginForm").style.display = "block";
            document.getElementById("signupForm").style.display = "none";
            document.getElementById("loginTab").classList.add("active");
            document.getElementById("signupTab").classList.remove("active");
            document.getElementById("formTitle").innerText = "Welcome Back!";
            document.getElementById("formSubtitle").innerText = "Login to continue your fitness journey.";
        }

        function showSignup() {
            document.getElementById("loginForm").style.display = "none";
            document.getElementById("signupForm").style.display = "block";
            document.getElementById("signupTab").classList.add("active");
            document.getElementById("loginTab").classList.remove("active");
            document.getElementById("formTitle").innerText = "Create Account";
            document.getElementById("formSubtitle").innerText = "Start your AI-powered fitness journey.";
        }

        window.showLogin = showLogin;
        window.showSignup = showSignup;

        if (!window.BF.configured) {
            console.warn("Local database not loaded.");
        }

        document.getElementById("loginForm").addEventListener("submit", async function(event) {
            event.preventDefault();
            const email = document.getElementById("loginEmail").value.trim();
            const password = document.getElementById("loginPassword").value;
            try {
                if (!window.BF.configured) throw new Error("Firebase is not configured yet. Open firebase-config.js and add your Firebase Web App config.");
                await window.BF.signInWithEmailAndPassword(window.BF.auth, email, password);
                const profile = await window.BF.getUserProfile();
                if (!profile) {
                    localStorage.setItem("bodyForceUser", JSON.stringify({ email }));
                }
                alert("Login Successful!");
                window.location.href = "dashboard.html";
            } catch (error) {
                alert(error.message || "Login failed.");
            }
        });

        document.getElementById("signupForm").addEventListener("submit", async function(event) {
            event.preventDefault();
            const name = document.getElementById("signupName").value.trim();
            const email = document.getElementById("signupEmail").value.trim();
            const password = document.getElementById("signupPassword").value;
            try {
                if (!window.BF.configured) throw new Error("Firebase is not configured yet. Open firebase-config.js and add your Firebase Web App config.");
                const credential = await window.BF.createUserWithEmailAndPassword(window.BF.auth, email, password);
                await window.BF.updateProfile(credential.user, { displayName: name });
                await window.BF.saveUserProfile({ name, email });
                alert("Account Created Successfully!");
                window.location.href = "profile.html";
            } catch (error) {
                alert(error.message || "Account creation failed.");
            }
        });
    </script>

</body>
</html>
